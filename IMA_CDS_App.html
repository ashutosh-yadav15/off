<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#05080f"/>
<meta name="description" content="IMA CDS Batch - Defence Academy Learning Platform"/>
<title>IMA | CDS Batch</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Exo+2:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>

<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#05080f;--bg2:#0a1020;--card:#0e1828;--card2:#142035;
  --olive:#5c8a3c;--olive2:#4a7030;--gold:#c8a96e;--gold2:#a88940;
  --navy:#1a3461;--navy2:#0f2040;
  --red:#c03838;--green:#3a9e50;
  --text:#e8ecf4;--text2:#8899b0;--text3:#5a6a80;
  --border:#1a2840;--border2:#243354;
  --sidebar-w:260px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;}
#root{height:100%;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--olive);}
.font-raj{font-family:'Rajdhani',sans-serif;}
.app-layout{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);height:100%;overflow-y:auto;flex-shrink:0;transition:transform .3s ease;z-index:50;}
.main-area{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40;}
.content{flex:1;padding:20px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;transition:all .2s ease;}
.card:hover{border-color:var(--border2);background:var(--card2);}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0a0800;font-weight:700;border:none;border-radius:8px;padding:10px 20px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:15px;letter-spacing:.5px;transition:all .2s;}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 4px 15px rgba(200,169,110,.35);}
.btn-olive{background:linear-gradient(135deg,var(--olive),var(--olive2));color:#fff;font-weight:600;border:none;border-radius:8px;padding:10px 20px;cursor:pointer;transition:all .2s;}
.btn-olive:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(92,138,60,.35);}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text2);border-radius:8px;padding:8px 16px;cursor:pointer;transition:all .2s;font-family:'Exo 2',sans-serif;}
.btn-ghost:hover{border-color:var(--olive);color:var(--olive);}
.badge-original{background:rgba(58,158,80,.2);color:#5fd97a;border:1px solid rgba(58,158,80,.4);font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;letter-spacing:.5px;}
.badge-duplicate{background:rgba(200,169,110,.2);color:#c8a96e;border:1px solid rgba(200,169,110,.4);font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;letter-spacing:.5px;}
.badge-copy{background:rgba(192,56,56,.2);color:#e06060;border:1px solid rgba(192,56,56,.4);font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;letter-spacing:.5px;}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--olive),var(--gold));transition:width .4s ease;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:8px;cursor:pointer;color:var(--text2);transition:all .2s;margin:2px 8px;font-size:14px;}
.nav-item:hover{background:var(--card2);color:var(--text);}
.nav-item.active{background:rgba(92,138,60,.2);color:var(--olive);border-left:3px solid var(--olive);}
.subject-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.lecture-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;}
.search-input{background:var(--card);border:1px solid var(--border2);color:var(--text);padding:10px 16px;border-radius:10px;font-family:'Exo 2',sans-serif;font-size:14px;width:100%;outline:none;transition:border .2s;}
.search-input:focus{border-color:var(--olive);}
.search-input::placeholder{color:var(--text3);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:45;display:none;}
.overlay.show{display:block;}
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);z-index:50;padding:8px 0 4px;}
.bottom-nav-items{display:flex;justify-content:space-around;}
.bottom-nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 12px;cursor:pointer;color:var(--text3);font-size:11px;transition:color .2s;}
.bottom-nav-item.active{color:var(--olive);}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--border2);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--text2);cursor:pointer;transition:all .2s;}
.chip.active{background:rgba(92,138,60,.2);border-color:var(--olive);color:var(--olive);}
.chip:hover{border-color:var(--text2);}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:16px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;}
textarea{background:var(--card2);border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:12px;font-family:'Exo 2',sans-serif;font-size:14px;resize:vertical;outline:none;transition:border .2s;width:100%;}
textarea:focus{border-color:var(--olive);}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.animate-fade{animation:fadeIn .3s ease forwards;}
.shimmer{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .overlay{display:none;}
  .overlay.show{display:block;}
  .bottom-nav{display:block;}
  .main-area{margin-bottom:65px;}
  .subject-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));}
  .lecture-grid{grid-template-columns:1fr;}
  .content{padding:14px;}
  .topbar{padding:10px 14px;}
}
@media(min-width:769px){
  .sidebar{transform:none !important;}
}
.star-btn{background:none;border:none;cursor:pointer;font-size:20px;padding:4px;line-height:1;transition:transform .2s;}
.star-btn:hover{transform:scale(1.2);}
.check-btn{width:28px;height:28px;border-radius:50%;border:2px solid var(--border2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
.check-btn.done{background:var(--green);border-color:var(--green);}
.check-btn:hover{border-color:var(--olive);}
select{background:var(--card);border:1px solid var(--border2);color:var(--text);padding:8px 12px;border-radius:8px;font-family:'Exo 2',sans-serif;font-size:13px;outline:none;cursor:pointer;}
select:focus{border-color:var(--olive);}
.hero-pattern{background-image:repeating-linear-gradient(45deg,transparent,transparent 10px,rgba(92,138,60,.03) 10px,rgba(92,138,60,.03) 20px);}
input[type=file]{display:none;}
.file-label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border:2px dashed var(--border2);border-radius:12px;padding:40px 20px;cursor:pointer;transition:all .2s;color:var(--text2);}
.file-label:hover{border-color:var(--olive);color:var(--olive);}
</style>
</head>

function loadLS(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}}
function saveLS(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

function buildLectures(raw){
  return raw.map(r=>({
    id:r[0], subject:r[1], lectureNum:r[2], title:r[3], link:r[4], flag:r[5]
  }));
}

function groupBySubject(lectures){
  const g={};
  lectures.forEach(l=>{
    if(!g[l.subject])g[l.subject]=[];
    g[l.subject].push(l);
  });
  return g;
}

function getStats(lectures,completed,bookmarks){
  const total=lectures.length;
  const done=lectures.filter(l=>completed[l.id]).length;
  const bm=lectures.filter(l=>bookmarks[l.id]).length;
  return{total,done,pending:total-done,pct:total?Math.round(done/total*100):0,bm};
}

function ProgressBar({pct,color}){
  return <div className="progress-bar"><div className="progress-fill" style={{width:pct+'%',background:color||'linear-gradient(90deg,#5c8a3c,#c8a96e)'}}></div></div>;
}

function FlagBadge({flag}){
  if(flag==='duplicate')return <span className="badge-duplicate">DUPLICATE</span>;
  if(flag==='copy')return <span className="badge-copy">COPY</span>;
  return <span className="badge-original">ORIGINAL</span>;
}

function SubjectIcon({subj}){

}

  const extra=Object.keys(grouped).filter(s=>!SUBJECTS_ORDER.includes(s)&&s.toLowerCase().includes(search.toLowerCase()));

  return(
    <div className="content animate-fade">

function AdminPage({onImport}){
  const [previewData,setPreviewData]=useState(null);
  const [file,setFile]=useState(null);
  const [importing,setImporting]=useState(false);
  const [msg,setMsg]=useState('');

  const handleFile=async(e)=>{
    const f=e.target.files[0];
    if(!f)return;
    setFile(f);
    setMsg('Reading file...');
    try{
      // Use SheetJS if available or show manual instructions
      const XLSX=window.XLSX;
      if(!XLSX){setMsg('⚠️ XLSX library not loaded. Please use the format guide below.');return;}
      const ab=await f.arrayBuffer();
      const wb=XLSX.read(ab);
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1});
      setPreviewData(rows.slice(0,10));
      setMsg(`✅ File read! ${rows.length-1} rows found. Headers: ${rows[0]?.join(', ')}`);
    }catch(err){setMsg('Error reading file: '+err.message);}
  };

  return(
    <div className="content animate-fade">
      <h2 className="font-raj" style={{fontSize:'22px',fontWeight:700,marginBottom:20}}>📤 Upload Excel Data</h2>
      <div className="card" style={{padding:'20px',marginBottom:16}}>
        <div className="font-raj" style={{fontSize:'16px',fontWeight:600,marginBottom:12}}>📋 Required Excel Format</div>
        <div style={{overflowX:'auto'}}>
          <table style={{borderCollapse:'collapse',fontSize:'13px',minWidth:400}}>
            <thead>
              <tr style={{background:'var(--card2)'}}>
                {['Subject','Topic/Class','Lecture Link'].map(h=>(
                  <th key={h} style={{padding:'8px 12px',border:'1px solid var(--border2)',textAlign:'left',color:'var(--gold)'}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {[['Maths','1. Introduction','https://zoom.us/rec/share/...'],['Polity','1. Article 368','https://zoom.us/rec/share/...']].map((r,i)=>(
                <tr key={i} style={{background:i%2?'var(--card2)':'transparent'}}>
                  {r.map((c,j)=><td key={j} style={{padding:'8px 12px',border:'1px solid var(--border)',color:'var(--text2)'}}>{c}</td>)}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div style={{fontSize:'12px',color:'var(--text3)',marginTop:8}}>Column names must match exactly. Lecture number is extracted from "Topic/Class" prefix (e.g., "1. Title").</div>
      </div>
      <div className="card" style={{padding:'20px',marginBottom:16}}>
        <div className="font-raj" style={{fontSize:'16px',fontWeight:600,marginBottom:12}}>📁 Select Excel File</div>
        <label className="file-label">
          <input type="file" accept=".xlsx,.xls,.csv" onChange={handleFile}/>
          <div style={{fontSize:'40px'}}>📂</div>
          <div style={{fontWeight:600}}>Click to select Excel file</div>
          <div style={{fontSize:'12px',color:'var(--text3)'}}>Supports .xlsx, .xls files</div>
        </label>
        {msg&&<div style={{marginTop:12,padding:'10px 14px',background:'var(--card2)',borderRadius:8,fontSize:'13px',color:'var(--text2)'}}>{msg}</div>}
      </div>
      {previewData&&(
        <div className="card" style={{padding:'20px',marginBottom:16}}>
          <div className="font-raj" style={{fontSize:'16px',fontWeight:600,marginBottom:12}}>👁️ Preview (first 10 rows)</div>
          <div style={{overflowX:'auto'}}>
            <table style={{borderCollapse:'collapse',fontSize:'12px',minWidth:'100%'}}>
              <thead>
                <tr>{previewData[0]?.map((h,i)=><th key={i} style={{padding:'6px 10px',border:'1px solid var(--border2)',color:'var(--gold)',background:'var(--card2)',textAlign:'left'}}>{h}</th>)}</tr>
              </thead>
              <tbody>
                {previewData.slice(1).map((r,i)=>(
                  <tr key={i}>{r.map((c,j)=><td key={j} style={{padding:'6px 10px',border:'1px solid var(--border)',color:'var(--text2)',maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{String(c||'')}</td>)}</tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
      <div className="card" style={{padding:'20px',borderLeft:'3px solid var(--gold)'}}>
        <div className="font-raj" style={{fontSize:'15px',fontWeight:600,marginBottom:8,color:'var(--gold)'}}>💡 Note</div>
        <div style={{fontSize:'13px',color:'var(--text3)',lineHeight:1.7}}>
          This app currently uses data from your uploaded Excel file (897 lectures, 25 subjects). To add new data, please contact your administrator to rebuild the app with the new Excel file, or use the import feature above (requires XLSX library).
          <br/><br/>
          Current data: <strong style={{color:'var(--text)'}}>897 lectures</strong> across <strong style={{color:'var(--text)'}}>25 subjects</strong>.
        </div>
      </div>
    </div>
  );
}


// ===== MAIN APP =====
function App(){
  const allLectures=useMemo(()=>buildLectures(RAW_DATA),[]);
  const grouped=useMemo(()=>groupBySubject(allLectures),[allLectures]);

  const [page,setPage]=useState('dashboard');
  const [selectedLec,setSelectedLec]=useState(null);
  const [selectedSubj,setSelectedSubj]=useState(null);
  const [sidebarOpen,setSidebarOpen]=useState(false);
  const [searchQuery,setSearchQuery]=useState('');
  
  const [completed,setCompletedState]=useState(()=>loadLS('ima_completed',{}));
  const [bookmarks,setBookmarksState]=useState(()=>loadLS('ima_bookmarks',{}));
  const [notes,setNotesState]=useState(()=>loadLS('ima_notes',{}));
  const [recent,setRecentState]=useState(()=>loadLS('ima_recent',[]));
  const [lastWatched,setLastWatchedState]=useState(()=>loadLS('ima_lastWatched',null));

  const setCompleted=useCallback(v=>{const nv=typeof v==='function'?v(completed):v;setCompletedState(nv);saveLS('ima_completed',nv);},[completed]);
  const setBookmarks=useCallback(v=>{const nv=typeof v==='function'?v(bookmarks):v;setBookmarksState(nv);saveLS('ima_bookmarks',nv);},[bookmarks]);
  const setNotes=useCallback(v=>{const nv=typeof v==='function'?v(notes):v;setNotesState(nv);saveLS('ima_notes',nv);},[notes]);
  const setRecent=useCallback(v=>{const nv=typeof v==='function'?v(recent):v;setRecentState(nv);saveLS('ima_recent',nv);},[recent]);
  const setLastWatched=useCallback(v=>{setLastWatchedState(v);saveLS('ima_lastWatched',v);},[]);

  const navigatePage=(p)=>{setPage(p);setSidebarOpen(false);};

  const handleSearch=(q)=>{setSearchQuery(q);if(q)setPage('search');};

  // Page titles
  const pageTitle={
    dashboard:'🏠 Dashboard',
    subjects:'📚 All Subjects',
    lectures:selectedSubj?`${(SUBJECT_CONFIG[selectedSubj]||{icon:'📖'}).icon} ${selectedSubj}`:'Lectures',
    player:selectedLec?`Lec ${selectedLec.lectureNum} · ${selectedLec.title}`:'Player',
    search:'🔍 Search',
    bookmarks:'⭐ Bookmarks',
    recent:'🕐 Recent',
    progress:'📊 Progress',
    settings:'⚙️ Settings',
    admin:'📤 Admin Upload',
  }[page]||'IMA';

  // Nav for player - prev/next in same subject
  const subjectLecs=selectedSubj?grouped[selectedSubj]||[]:selectedLec?grouped[selectedLec.subject]||[]:[];
  const selIdx=selectedLec?subjectLecs.findIndex(l=>l.id===selectedLec.id):-1;
  const prevLec=selIdx>0?subjectLecs[selIdx-1]:null;
  const nextLec=selIdx<subjectLecs.length-1?subjectLecs[selIdx+1]:null;

  const handleSelectLec=(lec)=>{
    setSelectedLec(lec);
    setSelectedSubj(lec.subject);
    setPage('player');
  };

  return(
    <div className="app-layout">
      <Sidebar page={page} setPage={navigatePage} open={sidebarOpen} onClose={()=>setSidebarOpen(false)} grouped={grouped} completed={completed}/>
      <div className="main-area">
        <Topbar title={pageTitle} onMenuClick={()=>setSidebarOpen(!sidebarOpen)} onSearch={handleSearch} searchVal={searchQuery} page={page} setPage={setPage}/>
        {page==='dashboard'&&<Dashboard grouped={grouped} completed={completed} bookmarks={bookmarks} lastWatched={lastWatched} recent={recent} setPage={navigatePage} setSelected={handleSelectLec} setSelectedSubj={setSelectedSubj} allLectures={allLectures}/>}
        {page==='subjects'&&<SubjectsPage grouped={grouped} completed={completed} setPage={navigatePage} setSelectedSubj={setSelectedSubj}/>}
        {page==='lectures'&&selectedSubj&&<LecturesPage lectures={grouped[selectedSubj]||[]} subject={selectedSubj} completed={completed} bookmarks={bookmarks} setCompleted={setCompleted} setBookmarks={setBookmarks} setPage={navigatePage} setSelected={handleSelectLec} allLectures={allLectures}/>}
        {page==='player'&&selectedLec&&<PlayerPage lec={selectedLec} completed={completed} setCompleted={setCompleted} bookmarks={bookmarks} setBookmarks={setBookmarks} notes={notes} setNotes={setNotes} setLastWatched={setLastWatched} setRecent={setRecent} setPage={navigatePage} prevLec={prevLec} nextLec={nextLec} setSelected={handleSelectLec}/>}
        {page==='search'&&<SearchPage allLectures={allLectures} completed={completed} bookmarks={bookmarks} setCompleted={setCompleted} setBookmarks={setBookmarks} setPage={navigatePage} setSelected={handleSelectLec} initQuery={searchQuery}/>}
        {page==='bookmarks'&&<BookmarksPage allLectures={allLectures} bookmarks={bookmarks} setBookmarks={setBookmarks} completed={completed} setCompleted={setCompleted} setPage={navigatePage} setSelected={handleSelectLec}/>}
        {page==='recent'&&<RecentPage recent={recent} allLectures={allLectures} completed={completed} bookmarks={bookmarks} setCompleted={setCompleted} setBookmarks={setBookmarks} setPage={navigatePage} setSelected={handleSelectLec}/>}
        {page==='progress'&&<ProgressPage grouped={grouped} completed={completed}/>}
        {page==='settings'&&<SettingsPage setCompleted={setCompleted} setBookmarks={setBookmarks} setNotes={setNotes} setRecent={setRecent} setLastWatched={setLastWatched}/>}
        {page==='admin'&&<AdminPage/>}
      </div>
      <BottomNav page={page} setPage={navigatePage}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
